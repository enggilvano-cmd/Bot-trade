
services:
  postgres:
    image: postgres:14-alpine
    container_name: trading-system-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-net

  redis:
    image: redis:7-alpine
    container_name: trading-system-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-net

  # [CORREÇÃO 1] Adiciona um container para sincronizar o tempo do Docker.
  # Isto é CRUCIAL para evitar erros de timestamp da API da Bybit, especialmente
  # em ambientes como Docker Desktop no Windows/macOS onde o tempo pode dessincronizar.
  ntp-sync:
    image: cturra/ntp
    container_name: trading-system-ntp
    restart: "no"
    # Privileged é necessário para que o container possa alterar o relógio do host do Docker.
    privileged: true
    # Garante que este container inicie antes de qualquer outro serviço.
    networks:
      - trading-net

  app:
    build: .
    container_name: trading-system-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      ntp-sync:
        condition: service_started # Não precisa ser 'healthy', apenas iniciado.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local